name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only Postgres + postgres-meta (needed for type generation). Applies migrations and seed.
      - name: Start local Supabase
        run: >-
          npx supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,studio,edge-runtime,logflare,vector,supavisor
      - run: npm run db:test
      - name: Check generated types are up to date
        run: |
          npx supabase gen types typescript --local > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error::database.types.ts is stale. Run 'npm run db:types' and commit the result."
            exit 1
          fi
